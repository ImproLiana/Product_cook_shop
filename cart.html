<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Buy&Cook</title>
</head>
<body>
    <header>
        <nav>
            <a href="#" id="buy_cook">Buy&Cook</a>
            <form class="search">
                <img class="headers_img" src="images/magnifier.png" alt="поиск">
                <input type="search" id="search_input" placeholder="Найти блюдо">
            </form>
            <button id="cart" type="button">
                <img class="headers_img" src="images/basket.png" alt="корзина">
            </button>
            <button id="list" type="button">
                <img class="headers_img" src="images/list.png" alt="список">
            </button>
            <div class="menu">
                <button id="cart_dial" type="button">
                    <img class="headers_img" src="images/basket.png" alt="корзина">
                    <p>Корзина</p>
                </button>
                <button id="star" type="button">
                    <img class="headers_img" src="images/star.png" alt="звезда"> 
                    <p>Избранное</p>
                </button>
                <!-- <img class="headers_img" src="images/user.png" id="user"> -->
                <button id="plus" type="button">
                    <img class="headers_img" src="images/plus.png" alt="плюс">
                    <p>Предложить блюдо</p>
                </button>   
            </div> 
        </nav> 
    </header>

    <main>
        <section class="sect_cart">
            <h1>Корзина</h1>
            <p id="count_of_products"></p>
            <section id="cart_products"></section>
        </section>
        <section class="sect_result">
            <h2>Итог</h2>
            <p>Блюд</p>
            <p id="num_dish"></p>
            <p>Продуктов</p>
            <p id="num_product"></p>
            <p>Итого к оплате</p>
            <p id="num_result"></p>
            <button type="button" id="btn_copy_list">Скопировать список продуктов</button>
            <button type="button" id="btn_make_order">Оформить заказ</button>
        </section>
    </main>
    <dialog id="form_make_order">
        <h1>Оформление заказа</h1>
        <form id="form_order">
            <h2>Данные для доставки</h2>
            <label for="order_name">Имя</label>
            <input type="text" id="order_name" required placeholder="Иван">
            <label for="order_surname">Фамилия</label>
            <input type="text" id="order_surname" required placeholder="Иванов">
            <label for="order_address">Адрес доставки</label>
            <input type="text" id="order_address" required placeholder="Город, Улица, Дом, Квартира">
            <label for="order_number">Контактный номер</label>
            <input type="tel" id="order_number" required placeholder="+7 900 000-00-00">
            <button type="submit" id="btn_send_order">Создать заказ</button>
        </form>
        <div id="order_info">
            <h2>Ваш заказ</h2>
            <section id="order_summary"></section>
        </div>
    </dialog>
    <dialog id="add_recipe">
        <h1>Предложить блюдо</h1>
        <p id="sec_text_in_add">Выберите, насколько подробно хотите рассказать.</p>
        <button type="button" id="idea_recipe">Идея</button>
        <button type="button" id="only_rec_recipe">Рецепт</button>
        <button type="button" id="full_dish_recipe">Полное блюдо</button>
        <form class="idea">
            <label for="idea_text">Опишите вашу идею блюда</label>
            <textarea id="idea_text" placeholder="Например: хочу набор для домашней шаурмы" required></textarea>
            <button type="submit" id="btn_send_idea">Отправить идею</button>
        </form>
        <form class="only_rec">
            <label for="only_rec_name">Название блюда *</label>
            <input id="only_rec_name" type="text" placeholder="Например, Том Ям" required>
            <label for="only_rec_rec">Рецепт *</label>
            <textarea id="only_rec_rec" placeholder="Опишите шаги приготовления" required></textarea>
            <label for="only_rec_list">Список продуктов — необязательно</label>
            <textarea id="only_rec_list" placeholder="Одна строка - один продукт"></textarea>
            <button type="submit" id="btn_send_only_rec">Предложить рецепт</button>
        </form>
        <form class="full_dish">
            <label for="full_dish_img">Изображение блюда *</label>
            <input id="full_dish_img" type="file" accept="image/*" required>
            <label for="full_dish_name">Название блюда *</label>
            <input id="full_dish_name" type="text" placeholder="Например, Том Ям" required>
            <label for="full_dish_rec">Рецепт *</label>
            <textarea id="full_dish_rec" placeholder="Опишите шаги приготовления" required></textarea>
            <label for="full_dish_list">Список продуктов *</label>
            <textarea id="full_dish_list" placeholder="Лапша - 300 г Говядина - 400 г" required></textarea>
            <label for="full_dish_num">Количество порций</label>
            <input id="full_dish_num" type="number" value="2" min="1" step="1">
            <label for="full_dish_cost">Примерная стоимость, ₽</label>
            <input id="full_dish_cost" type="number" placeholder="700" min="0">
            <button type="submit" id="btn_send_full_dish">Добавить блюдо</button>
        </form>
    </dialog>
    <script src="script.js"></script>   
</body>
</html>
